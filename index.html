<script>
(function(){

const Utilities={formatDate(d,tz,f){const off={'Asia/Jakarta':7,'Asia/Makassar':8,'Asia/Jayapura':9}[tz]||8,x=new Date(+d+off*36e5),p=n=>String(n).padStart(2,'0'),s=x.getUTCFullYear()+'-'+p(x.getUTCMonth()+1)+'-'+p(x.getUTCDate())+' '+p(x.getUTCHours())+':'+p(x.getUTCMinutes());return /ss/.test(f)?s+':'+p(x.getUTCSeconds()):s;},getUuid:()=>crypto.randomUUID()};
const LockService={getScriptLock:()=>({waitLock(){},releaseLock(){}})},CacheService={getScriptCache:()=>({get(){return null;},put(){}})},PropertiesService={getScriptProperties:()=>({setProperty(){},getProperty(){return '0';}})};
/* ---------- Skema sheet: nama sheet -> urutan kolom (SATU-SATUNYA sumber nama kolom) ---------- */
const SCHEMA = {
  USERS: ['user_id','username','full_name','role','salt','password_hash','active','created_at'],
  SHUTDOWN_MASTER: ['shutdown_id','name','template_id','start_date','end_date','status','created_by','created_at'],
  TEMPLATE_MASTER: ['template_id','name','active','created_at'],
  TEMPLATE_FIELDS: ['field_id','template_id','field_name','field_type','options','sort','active'],
  MAINTENANCE_DATA: ['task_id','shutdown_id','description','planned_start','planned_finish','planned_duration_h','actual_start','actual_finish','pic','progress','status','last_updated','updated_by','remark','archived'],
  MAINTENANCE_VALUES: ['task_id','field_id','value'],
  MAINTENANCE_LOG: ['log_id','task_id','updated_by','timestamp','field_name','old_value','new_value','remark'],
  POWER_SCHEDULE: ['schedule_id','shutdown_id','phase','sequence','schedule_datetime','planned_power','planned_power_mode','planned_ghe','planned_ghe_mode','actual_datetime','actual_power','actual_ghe','actual_ghe_mode','remark','updated_by','updated_at'],
  POWER_INTERVALS: ['interval_id','shutdown_id','phase','start_schedule_id','end_schedule_id','start_datetime','end_datetime','duration_h','planned_calcine','actual_calcine','calc_status','formula_version','planned_calcine_mode','actual_calcine_mode'],
  OPERATIONAL_ACTIVITIES: ['activity_id','shutdown_id','phase','activity_name','planned_datetime','actual_datetime','status','remark','updated_by','updated_at','planned_end','actual_end'],
  POWER_CHANGE_LOG: ['log_id','schedule_id','updated_by','timestamp','field_name','old_value','new_value','remark'],
  NOTIFICATION_LOG: ['notif_id','shutdown_id','category','ref_id','message','created_at'],
  POWER_SETTINGS: ['key','value','description'],
  SETTINGS: ['key','value','description']
};
/* Fitur yang bisa dikunci password: [label, default]. Diubah dari Admin > Matriks izin (disimpan di SETTINGS: PERM_<fitur>). */
const FEATURES = {
  task_progress: ['Update progress task (slider)', 'OPEN'],
  task_edit: ['Tambah / edit / arsip task & import Excel', 'PASSWORD'],
  task_delete: ['Hapus task', 'PASSWORD'],
  grid_edit: ['Ubah jadwal task lewat grid jam (seret kotak jam)', 'PASSWORD'],
  project_delete: ['Hapus project permanen (beserta datanya)', 'PASSWORD'],
  power_edit: ['Edit data power, GHE, actual & aktivitas operasional', 'OPEN'],
  power_plan: ['Generate & hapus titik jadwal power', 'OPEN'],
  project_edit: ['Buat / ubah shutdown project', 'OPEN'],
  template_edit: ['Buat / edit template maintenance', 'PASSWORD'],
  settings_edit: ['Pengaturan power & notifikasi', 'PASSWORD'],
  tz_edit: ['Ubah zona waktu (WIB / WITA / WIT)', 'OPEN']
};  // 'matrix_edit' (ubah matriks ini) selalu minta password
const PW_SHEET = 'PASWORD';
const FORMULA_LABEL = 'v2: Calcine(t/h)=Power(MW)x1000/GHE(kWh/t)';
const PHASES = ['Ramp Down','Ramp Up'];

/* ---------- Helper sheet ---------- */

const MEMO = {};  // cache sheet selama 1 request; tetap sinkron saat menulis (tanpa baca ulang)
const norm_ = (n, o) => { const x = {}; SCHEMA[n].forEach(k => x[k] = o[k] == null ? '' : String(o[k])); return x; };


function add_(n, o) { addMany_(n, [o]); }


function ensure_(n, k, v, d) { if (!rows_(n).some(r => r.key === k)) add_(n, { key: k, value: v, description: d }); }
function cfg_() { const c = {}; rows_('POWER_SETTINGS').concat(rows_('SETTINGS')).forEach(r => { if (r.key.indexOf('OPNOTE_') !== 0) c[r.key] = r.value; }); c.TZ = tzKey_();
  if (/^v1:/.test(c.FORMULA_VERSION || '')) c.FORMULA_VERSION = FORMULA_LABEL;   // rumus lama (tanpa x1000) otomatis diganti label baru
  return c; }
/* ---------- Zona waktu aplikasi (pengaturan SETTINGS: TZ) — tidak lagi mengikuti zona Apps Script ---------- */
const TZ_MAP = { WIB: ['Asia/Jakarta', '+07:00'], WITA: ['Asia/Makassar', '+08:00'], WIT: ['Asia/Jayapura', '+09:00'] };
let TZK = null;
function tzKey_() {
  if (TZK) return TZK; let k = 'WITA';
  try { const r = rows_('SETTINGS').find(x => x.key === 'TZ'); if (r && TZ_MAP[r.value]) k = r.value; } catch (e) {}
  return (TZK = k);
}
function tz_() { return TZ_MAP[tzKey_()][0]; }
function ssTz_() { return SpreadsheetApp.getActiveSpreadsheet().getSpreadsheetTimeZone(); }
function now_() { return Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd HH:mm:ss'); } // timestamp server
function id_(p) { return p + '-' + Utilities.getUuid().slice(0, 8).toUpperCase(); }
function dt_(s) { // teks waktu lokal (WIB/WITA/WIT sesuai pengaturan) -> Date absolut
  if (!s) return null; const t = String(s).replace(' ', 'T'); return new Date((t.length <= 10 ? t + 'T00:00' : t.slice(0, 16)) + ':00' + TZ_MAP[tzKey_()][1]);
}
function num_(v) { return (v === '' || v == null) ? NaN : Number(v); }

/* ---------- Password & API ---------- */





/* ---------- Penanda perubahan data (dipakai browser untuk sinkron antar device) ---------- */
function bumpRev_() { try { PropertiesService.getScriptProperties().setProperty('REV', String(Date.now())); } catch (e) {} }

/* ---------- Maintenance ---------- */
function taskDeco_(t, cfg) {
  const pr = Number(t.progress) || 0, n = new Date(), pf = dt_(t.planned_finish), ps = dt_(t.planned_start);
  t.status = pr >= 100 ? 'Completed' : pr > 0 ? 'Ongoing' : 'Not Started';
  t.deadline = pr >= 100 ? 'Completed' : (pf && n > pf) ? 'Overdue' : (pf && pf - n <= Number(cfg.APPROACH_H || 24) * 3600000) ? 'Approaching' : 'On Schedule';
  t.delayed_start = pr === 0 && ps && n > ps ? 'Y' : '';
  return t;
}
const LOGQ = { MAINTENANCE_LOG: [], POWER_CHANGE_LOG: [] };  // log dikumpulkan lalu ditulis sekali (flushLogs_)
function flushLogs_() { Object.keys(LOGQ).forEach(n => { if (LOGQ[n].length) addMany_(n, LOGQ[n].splice(0)); }); }
function logM_(tid, u, f, o, n, rem, ts) {
  LOGQ.MAINTENANCE_LOG.push({ _sid: sidOf_(tid), log_id: id_('MLG'), task_id: tid, updated_by: u.username, timestamp: ts, field_name: f, old_value: o, new_value: n, remark: rem || '' });
}
function oneTask_(tid) {
  const t = rows_('MAINTENANCE_DATA').find(x => x.task_id === tid); if (!t) return null;
  const c = {}; rows_('MAINTENANCE_VALUES').filter(v => v.task_id === tid).forEach(v => c[v.field_id] = v.value);
  t.custom = c; return taskDeco_(t, cfg_());
}
function getTasks_(u, p) {
  const cfg = cfg_(), vals = rows_('MAINTENANCE_VALUES'), fm = {};
  vals.forEach(v => { (fm[v.task_id] = fm[v.task_id] || {})[v.field_id] = v.value; });
  return rows_('MAINTENANCE_DATA').filter(t => t.shutdown_id === p.shutdown_id && (p.archived ? true : t.archived !== 'Y'))
    .map(t => { t.custom = fm[t.task_id] || {}; return taskDeco_(t, cfg); });
}
function saveTask_(u, p) {
  const t = p.task, ts = now_();
  if (!t) throw new Error('Data task kosong.');
  const cur = t.task_id ? rows_('MAINTENANCE_DATA').find(x => x.task_id === t.task_id) : null;
  let tid;
  if (!cur) {
    if (!t.shutdown_id || !String(t.description || '').trim()) throw new Error('Work Description wajib diisi.');
    if (!t.planned_start || !t.planned_finish) throw new Error('Planned Start & Finish wajib diisi.');
    const pr = Math.min(100, Math.max(0, Number(t.progress) || 0));
    if (dt_(t.planned_finish) < dt_(t.planned_start)) throw new Error('Planned Finish lebih awal dari Planned Start.');
    tid = id_('TSK');
    add_('MAINTENANCE_DATA', { task_id: tid, shutdown_id: t.shutdown_id, description: t.description, planned_start: t.planned_start, planned_finish: t.planned_finish,
      planned_duration_h: ((dt_(t.planned_finish) - dt_(t.planned_start)) / 3600000).toFixed(2), actual_start: pr > 0 ? ts : '', actual_finish: pr >= 100 ? ts : '',
      pic: t.pic || '', progress: pr, status: pr >= 100 ? 'Completed' : pr > 0 ? 'Ongoing' : 'Not Started', last_updated: ts, updated_by: u.username, remark: t.remark || '', archived: '' });
    logM_(tid, u, 'TASK_CREATED', '', t.description, t.remark, ts);

function importPower_(u, p) {
  const sid = p.shutdown_id, rows = p.rows || [];

  const ts = now_(), phases = {}; rows.forEach(r => phases[r.phase] = 1);
  let ex = rows_('POWER_SCHEDULE').slice();
  if (p.replace) ex = ex.filter(r => !(r.shutdown_id === sid && phases[r.phase]));
  const idx = {}, seq = {}; ex.forEach(r => { if (r.shutdown_id === sid) { idx[r.phase + '|' + r.schedule_datetime] = r; seq[r.phase] = Math.max(seq[r.phase] || 0, Number(r.sequence) || 0); } });
  const adds = [], logs = []; let upd = 0, bad = 0;
  rows.forEach(r => {
    if (PHASES.indexOf(r.phase) < 0 || !r.schedule_datetime) { bad++; return; }
    const o = { planned_power: r.planned_power, planned_ghe: r.planned_ghe, actual_datetime: r.actual_datetime, actual_power: r.actual_power, actual_ghe: r.actual_ghe, remark: r.remark };
    const cur = idx[r.phase + '|' + r.schedule_datetime];
    if (cur) { Object.keys(o).forEach(k => { if (o[k] !== undefined && o[k] !== '') cur[k] = o[k]; }); cur.updated_by = u.username; cur.updated_at = ts; upd++; return; }
    const n = { schedule_id: id_('PWR'), shutdown_id: sid, phase: r.phase, sequence: (seq[r.phase] = (seq[r.phase] || 0) + 1), schedule_datetime: r.schedule_datetime,
      planned_power_mode: 'Manual', planned_ghe_mode: 'Manual', actual_ghe_mode: 'Manual', updated_by: u.username, updated_at: ts };
    Object.keys(o).forEach(k => n[k] = o[k] == null ? '' : o[k]);
    adds.push(n); idx[r.phase + '|' + r.schedule_datetime] = n;
    logs.push({ log_id: id_('PLG'), schedule_id: n.schedule_id, updated_by: u.username, timestamp: ts, field_name: 'ROW_CREATED', old_value: '', new_value: r.schedule_datetime + ' (import)', remark: '' });
  });
  rewrite_('POWER_SCHEDULE', ex.concat(adds)); addMany_('POWER_CHANGE_LOG', logs); recalc_(sid);
  const pw = getPower_(u, { shutdown_id: sid }); pw.imported = { added: adds.length, updated: upd, skipped: bad }; return pw;
}

function getTimeline_(u, p) {
  const tasks = {}, ev = [], sid = p.shutdown_id;
  rows_('MAINTENANCE_DATA').filter(t => t.shutdown_id === sid).forEach(t => tasks[t.task_id] = t.description);
  rows_('MAINTENANCE_LOG').filter(l => tasks[l.task_id]).forEach(l => ev.push({ time: l.timestamp, type: 'Maintenance', by: l.updated_by, text: tasks[l.task_id] + ' - ' + l.field_name + ': ' + (l.old_value || '-') + ' → ' + (l.new_value || '-') }));
  const sch = {}; rows_('POWER_SCHEDULE').filter(r => r.shutdown_id === sid).forEach(r => sch[r.schedule_id] = r.phase + ' ' + r.schedule_datetime);
  const acts = {}; rows_('OPERATIONAL_ACTIVITIES').filter(r => r.shutdown_id === sid).forEach(r => acts[r.activity_id] = r.activity_name);
  rows_('POWER_INTERVALS').filter(i => i.shutdown_id === sid).forEach(i => sch[i.interval_id] = 'Calcine ' + i.phase + ' ' + i.start_datetime);
  rows_('POWER_CHANGE_LOG').filter(l => sch[l.schedule_id] || acts[l.schedule_id]).forEach(l => ev.push({ time: l.timestamp, type: acts[l.schedule_id] ? 'Activity' : 'Power', by: l.updated_by, text: (sch[l.schedule_id] || acts[l.schedule_id]) + ' - ' + l.field_name + ': ' + (l.old_value || '-') + ' → ' + (l.new_value || '-') }));

}

function recalcLocal(){ // cermin recalc_ di server agar angka calcine & delta langsung berubah di layar
 const avg=S.cfg.CALCINE_METHOD==='AVERAGE',old={},out=[];S.power.intervals.forEach(i=>old[i.interval_id]=i);
 const rate=(p,g)=>(N(p)>0&&N(g)>0)?N(p)*1000/N(g):null; // t/h = MW x 1000 / (kWh/t)
 PHASES.forEach(ph=>{const r=S.power.schedule.filter(x=>x.phase===ph&&isFinite(+D(x.schedule_datetime))).sort((a,b)=>a.schedule_datetime<b.schedule_datetime?-1:1);
  for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],h=(D(b.schedule_datetime)-D(a.schedule_datetime))/36e5,ah=(a.actual_datetime&&b.actual_datetime)?(D(b.actual_datetime)-D(a.actual_datetime))/36e5:h;
   const pick=(pk,gk)=>{const ra=rate(a[pk],a[gk]);if(!avg)return ra;const rb=rate(b[pk],b[gk]);return ra==null||rb==null?null:(ra+rb)/2;};
   const pr=pick('planned_power','planned_ghe'),ar=pick('actual_power','actual_ghe'),id='INT-'+a.schedule_id+'-'+b.schedule_id,o=old[id]||{},pm=o.planned_calcine_mode==='Manual',am=o.actual_calcine_mode==='Manual';
   out.push({interval_id:id,shutdown_id:S.sid,phase:ph,start_schedule_id:a.schedule_id,end_schedule_id:b.schedule_id,start_datetime:a.schedule_datetime,end_datetime:b.schedule_datetime,duration_h:h.toFixed(2),
    planned_calcine:pm?o.planned_calcine:(pr==null?'':pr.toFixed(3)),actual_calcine:am?o.actual_calcine:(ar==null?'':ar.toFixed(3)),calc_status:'Calculated',formula_version:S.cfg.FORMULA_VERSION,
    planned_calcine_mode:pm?'Manual':'Auto',actual_calcine_mode:am?'Manual':'Auto'});}});
 S.power.intervals=out;}

const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,ags:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function mk(y,mo,d,h,mi){y=+y;if(y<100)y+=2000;if(mo>12&&d<=12){const x=mo;mo=d;d=x;}if(mo<1||mo>12||d<1||d>31)return '';return y+'-'+z(mo)+'-'+z(d)+' '+z(h||0)+':'+z(mi||0);}
function pDT(v){v=String(v==null?'':v).trim();if(!v)return '';let m;
 if(m=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))return mk(m[1],+m[2],+m[3],+m[4],+m[5]);
 if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))return mk(m[3],+m[2],+m[1],+m[4],+m[5]);
 if(m=v.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3,})\.?[\s\-\/,]*(\d{2,4})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/)){const mo=MON[m[2].slice(0,3).toLowerCase()];return mo?mk(m[3],mo,+m[1],+m[4],+m[5]):'';}
 const t=new Date(v);return isNaN(t)?'':mk(t.getFullYear(),t.getMonth()+1,t.getDate(),t.getHours(),t.getMinutes());}
const pT=v=>{const m=String(v||'').match(/(\d{1,2})[:.](\d{2})/);return m?z(m[1])+':'+m[2]:'';};

const pPct=v=>{const n=Number(String(v).replace('%','').replace(',','.'));return isNaN(n)?0:Math.min(100,Math.max(0,n));};
const colL=i=>{let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26);}return s;};

 if(kind==='task'){

 '<h3>Tujuan impor</h3><div class="fr"><label><input type="radio" name="iw_tp" value="cur" checked> Project saat ini: <b>'+esc(pn(proj().name)||'')+'</b></label><label><input type="radio" name="iw_tp" value="new"> Project baru: <input id="iw_pn" placeholder="Nama project baru" style="width:60%"></label></div>'+
 '<div class="fr"><label>Kolom tambahan (non-standar) disimpan sebagai:</label><label><input type="radio" name="iw_fm" value="local" checked> Field khusus project ini saja (tidak disimpan sebagai template)</label><label><input type="radio" name="iw_fm" value="tpl"> Template baru: <input id="iw_tn" placeholder="Nama template baru" style="width:50%"></label></div>'+
 '<div class="tb"><label class="lb">Planned Start default <input type="datetime-local" id="iw_d1"></label><label class="lb">Planned Finish default <input type="datetime-local" id="iw_d2"></label></div><div class="mute">Default dipakai bila kolom tanggal tidak dipetakan atau selnya kosong.</div>'+
 '<label style="display:block;margin-top:6px"><input type="checkbox" id="iw_arch"> Arsipkan task lama di project tujuan lebih dulu</label>':
 '<h3>Opsi</h3><div class="fr"><label>Phase</label><select id="iw_ph"><option value="col">Ambil dari kolom (dipetakan sebagai "Phase")</option><option>Ramp Down</option><option>Ramp Up</option></select></div><label><input type="checkbox" id="iw_rep"> Ganti jadwal yang sudah ada pada phase yang diimpor (kalau tidak, titik dengan waktu sama akan diperbarui)</label>';
 $('iw_opt').innerHTML=o;rebuild();}
function rebuild(){
 buildCols();const A=W.aoa,from=Math.max(0,W.hs-1),to=Math.min(A.length,W.ds+4),nc=Math.min(A[0]?A[0].length:0,60);
 let h='<table><tr><th>#</th>'+Array.from({length:nc},(_,c)=>'<th>'+colL(c)+'</th>').join('')+'</tr>';
 for(let r=from;r<to;r++)h+='<tr'+(r>=W.hs&&r<W.hs+W.hr?' class="hr"':'')+'><td>'+(r+W.off.r+1)+'</td>'+A[r].slice(0,nc).map(v=>'<td title="'+esc(v)+'">'+esc(clean(v).slice(0,40))+'</td>').join('')+'</tr>';
 $('iw_pv').innerHTML=h+'</table>';
 const roles=IMP[W.kind].roles;
 $('iw_map').innerHTML='<table><tr><th>Kolom</th><th>Nama dari header</th><th>Contoh isi</th><th>Terisi</th><th>Jadikan</th><th>Nama field (kolom tambahan)</th></tr>'+W.cols.map(c=>'<tr><td>'+colL(c.i)+'</td><td>'+esc(c.name)+'</td><td class="mute">'+esc(c.samples.join(' | ').slice(0,60))+'</td><td>'+c.n+'</td><td><select data-ci="'+c.i+'">'+roles.map(r=>'<option value="'+r[0]+'"'+(r[0]===c.role?' selected':'')+'>'+r[1]+'</option>').join('')+'</select></td><td><input data-fn="'+c.i+'" value="'+esc(c.fname)+'"'+(c.role==='custom'?'':' disabled')+'></td></tr>').join('')+'</table>';
 $('iw_map').querySelectorAll('select').forEach(s=>s.onchange=()=>{const c=W.cols[+s.dataset.ci];c.role=s.value;$('iw_map').querySelector('[data-fn="'+c.i+'"]').disabled=c.role!=='custom';});
 $('iw_map').querySelectorAll('[data-fn]').forEach(i=>i.oninput=()=>W.cols[+i.dataset.fn].fname=i.value.trim());}
function mapRows(){const A=W.aoa,rows=[];let badDate=0;
 const by=r=>W.cols.filter(c=>c.role===r);
 for(let r=W.ds;r<A.length;r++){const row=A[r],g=c=>clean(row[c.i]);
  if(W.kind==='task'){const o={custom:{}};
   W.cols.forEach(c=>{const v=W.cols[c.i].role==='description'?String(row[c.i]==null?'':row[c.i]).trim():g(c);if(!v)return;
    if(c.role==='description')o.description=v;else if(c.role==='planned_start'||c.role==='planned_finish'){const d=pDT(v);if(d)o[c.role]=d;else badDate++;}
    else if(c.role==='progress')o.progress=pPct(v);else if(c.role==='custom'){if(c.fname)o.custom[c.fname]=v;}else if(c.role!=='ignore')o[c.role]=v;});
   if(!o.description)continue;rows.push(o);}
  else{const o={},first=c=>{const x=by(c)[0];return x?g(x):'';};
   const ph=gv('iw_ph');let phase=ph;if(ph==='col'){const t=first('phase').toLowerCase();phase=/down|turun|\brd\b/.test(t)?'Ramp Down':/up|naik|\bru\b/.test(t)?'Ramp Up':'';}
   let dt=pDT(first('schedule_datetime'));if(!dt){const d=pDT(first('date')),t=pT(first('time'));if(d)dt=d.slice(0,10)+' '+(t||d.slice(11));}
   if(!phase||!dt){if(W.cols.some(c=>g(c)))badDate++;continue;}
   o.phase=phase;o.schedule_datetime=dt;['planned_power','planned_ghe','actual_power','actual_ghe'].forEach(k=>o[k]=pNum(first(k)));
   o.actual_datetime=pDT(first('actual_datetime'));o.remark=first('remark');rows.push(o);}}
 return {rows,badDate};}
async function doImport(){
 if(!W||!W.wb)throw new Error('Pilih file Excel dulu atau tempel datanya.');
 const {rows,badDate}=mapRows();
 if(W.kind==='task'){
  if(!W.cols.some(c=>c.role==='description'))throw new Error('Petakan satu kolom sebagai "Work Description".');
  if(!rows.length)throw new Error('Tidak ada baris dengan Work Description.');
  const d1=toS(gv('iw_d1')),d2=toS(gv('iw_d2'));rows.forEach(o=>{o.planned_start=o.planned_start||d1;o.planned_finish=o.planned_finish||d2;});
  const names=[...new Set(W.cols.filter(c=>c.role==='custom'&&c.fname).map(c=>c.fname))],newP=document.querySelector('input[name=iw_tp]:checked').value==='new',tplMode=document.querySelector('input[name=iw_fm]:checked').value==='tpl';
  if(newP&&!gv('iw_pn').trim())throw new Error('Isi nama project baru.');if(tplMode&&!gv('iw_tn').trim())throw new Error('Isi nama template baru.');
  let sid=S.sid,tid=proj().template_id||(S.templates[0]||{}).template_id;
  if(tplMode){const r=await call('saveTemplate',{name:gv('iw_tn').trim(),fields:names.map(n=>({name:n,type:'text',options:''}))});tid=r.template_id;}
  if(newP){const r=await call('saveProject',{project:{name:gv('iw_pn').trim(),template_id:tid,status:'Active'}});sid=r.shutdown_id;}
  else if(tplMode)await call('saveProject',{project:{shutdown_id:sid,name:pn(proj().name),template_id:tid,start_date:proj().start_date,end_date:proj().end_date,status:proj().status}});
  const res=await call('importTasks',{shutdown_id:sid,rows,fields:names,archive_old:document.getElementById('iw_arch').checked});
  S.sid=sid;const d=await call('bootstrap');Object.assign(S,d);fillProj();toast(res.count+' task diimpor'+(badDate?' · '+badDate+' tanggal tidak terbaca (diganti default)':''));
 }else{
  if(!rows.length)throw new Error('Tidak ada baris valid. Petakan Phase dan Schedule DateTime (atau Tanggal + Jam).');
  const res=await call('importPower',{shutdown_id:S.sid,rows,replace:document.getElementById('iw_rep').checked});rerender();
  toast(res.imported.added+' titik ditambah, '+res.imported.updated+' diperbarui'+(badDate?' · '+badDate+' baris dilewati (phase/waktu tidak terbaca)':''));}}

/* ---- Export Excel (semua data project aktif) ---- */
async function exportXlsx(){await run(async()=>{
 if(!S.sid)throw new Error('Pilih shutdown project dulu.');if(!window.XLSX)throw new Error('Library Excel belum termuat (cek koneksi internet).');
 const d=await call('exportData',{shutdown_id:S.sid}),fs=pfields(),nm=v=>v===''||v==null||isNaN(Number(v))?(v||''):Number(v);
 const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{'(kosong)':''}]),n);
 add('Maintenance',d.tasks.map(t=>{const o={'Task ID':t.task_id,'Work Description':t.description,'PIC':t.pic,'Planned Start':t.planned_start,'Planned Finish':t.planned_finish,'Duration (h)':nm(t.planned_duration_h),'Actual Start':t.actual_start,'Actual Finish':t.actual_finish,'Progress (%)':nm(t.progress),'Status':t.status,'Deadline':t.deadline,'Remark':t.remark,'Last Updated':t.last_updated,'Updated By':t.updated_by,'Archived':t.archived==='Y'?'Ya':''};fs.forEach(f=>o[f.field_name]=t.custom[f.field_id]||'');return o;}));
 add('Maintenance Log',d.log.map(l=>({'Task ID':l.task_id,'Updated By':l.updated_by,'Timestamp':l.timestamp,'Field':l.field_name,'Old':l.old_value,'New':l.new_value,'Remark':l.remark})));
 add('Power Schedule',d.schedule.map(r=>({'Phase':r.phase,'Plan DateTime':r.schedule_datetime,'Plan Power (MW)':nm(r.planned_power),'Plan GHE (kWh/t)':nm(r.planned_ghe),'Actual DateTime':r.actual_datetime,'Actual Power (MW)':nm(r.actual_power),'Actual GHE (kWh/t)':nm(r.actual_ghe),'Delta Power':(r.actual_power===''||r.planned_power==='')?'':Number(r.actual_power)-Number(r.planned_power),'Delta GHE':(r.actual_ghe===''||r.planned_ghe==='')?'':Number(r.actual_ghe)-Number(r.planned_ghe),'Remark':r.remark,'Updated By':r.updated_by,'Updated At':r.updated_at})));
 add('Calcine Interval',d.intervals.map(i=>({'Phase':i.phase,'Start':i.start_datetime,'End':i.end_datetime,'Duration (h)':nm(i.duration_h),'Planned Calcine (t/h)':nm(i.planned_calcine),'Actual Calcine (t/h)':nm(i.actual_calcine),'Planned Calcine (ton)':i.planned_calcine===''?'':Number(i.planned_calcine)*Number(i.duration_h),'Actual Calcine (ton)':i.actual_calcine===''?'':Number(i.actual_calcine)*Number(i.duration_h),'Status':i.calc_status,'Formula':i.formula_version,'Planned mode':i.planned_calcine_mode||'Auto','Actual mode':i.actual_calcine_mode||'Auto'})));
 add('Operational Activities',d.activities.map(a=>({'Phase':a.phase,'Activity':a.activity_name,'Planned':a.planned_datetime,'Planned End':a.planned_end,'Actual':a.actual_datetime,'Actual End':a.actual_end,'Status':a.status_eff,'Remark':a.remark,'Updated By':a.updated_by,'Updated At':a.updated_at})));
 add('Power Log',d.powerlog.map(l=>({'Ref ID':l.schedule_id,'Updated By':l.updated_by,'Timestamp':l.timestamp,'Field':l.field_name,'Old':l.old_value,'New':l.new_value})));
 XLSX.writeFile(wb,'Shutdown_'+(pn(proj().name)||'project').replace(/[^\w-]+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('File Excel diunduh');});}

run(boot);
