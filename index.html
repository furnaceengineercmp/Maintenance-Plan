<!DOCTYPE html>
<html lang="id" data-theme="light"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Furnace Shutdown Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef0f3;--card:#fff;--tx:#18202b;--mute:#6a7684;--line:#dde2e8;--soft:#f4f6f9;--hd:#12161c;--hd2:#1b212a;--rd:#e8590c;--ru:#1c7ed6;--ok:#2b9348;--warn:#e67700;--bad:#d62839;--idle:#8a94a0;--sh:0 1px 2px rgba(20,30,45,.06),0 6px 18px rgba(20,30,45,.05)}
[data-theme=dark]{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mute:#8b98a7;--line:#2a313c;--soft:#1d2430;--hd:#090c10;--hd2:#131921;--rd:#ff7a3d;--ru:#4dabf7;--ok:#51cf66;--warn:#ffa94d;--bad:#ff6b6b;--idle:#7b8794;--sh:0 1px 2px rgba(0,0,0,.5)}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",Roboto,Arial,sans-serif;transition:background .25s,color .25s}

#top{position:sticky;top:0;z-index:25}
td input.man{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 18%,var(--card))}

header{background:var(--hd);color:#fff;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:3px solid;border-image:linear-gradient(90deg,#e8590c,#ffa94d,#1c7ed6) 1}
header h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:190px;letter-spacing:.2px}
header h1 small{display:block;font-weight:400;font-size:11px;color:#8b98a7}
header select,header button{background:var(--hd2);color:#fff;border:1px solid #333c48;border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
header select:hover,header button:hover{border-color:#ffa94d}
nav{background:var(--hd2);display:flex;overflow-x:auto;padding:0 10px;gap:2px}
nav button{background:none;border:0;color:#9aa6b4;padding:11px 16px;font:inherit;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}

.grid{display:grid;gap:16px;grid-template-columns:minmax(260px,330px) 1fr;margin-bottom:16px}

.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0}
.ring{width:170px;height:170px}.rt{fill:none;stroke:var(--line);stroke-width:11}.rv{fill:none;stroke:url(#rg);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.2,1)}
.rn{fill:var(--tx);font-size:25px;font-weight:700;text-anchor:middle}.rl{fill:var(--mute);font-size:8.5px;text-anchor:middle}
.seg{display:flex;height:10px;border-radius:6px;overflow:hidden;width:100%;background:var(--line)}.seg i{display:block;transition:width .6s}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c,var(--idle));border-radius:10px;padding:11px 13px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--sh)}
.kpi:hover{transform:translateY(-3px)}.kpi b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.kpi span{color:var(--mute);font-size:12px}
.ph2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.phc{border-left:4px solid var(--c);background:var(--soft);border-radius:8px;padding:10px 12px}.phc b{font-size:18px;font-variant-numeric:tabular-nums}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ru);box-shadow:0 0 0 3px color-mix(in srgb,var(--ru) 25%,transparent)}
button.b{background:var(--tx);color:var(--card);border:0;border-radius:6px;padding:7px 13px;font:inherit;cursor:pointer;transition:transform .1s,opacity .15s}
button.b:hover{opacity:.88}button.b:active{transform:scale(.97)}
button.b.alt{background:transparent;color:var(--tx);border:1px solid var(--line)}button.b.alt:hover{border-color:var(--tx)}button.b.sm{padding:3px 9px;font-size:12px}
button:disabled{opacity:.5;cursor:wait}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--tx);border-radius:20px;padding:4px 13px;cursor:pointer;font-size:13px;transition:all .15s}
.chip b{margin-left:5px;color:var(--mute);font-variant-numeric:tabular-nums}.chip:hover{border-color:var(--tx)}.chip.on{background:var(--tx);color:var(--card);border-color:var(--tx)}.chip.on b{color:var(--card)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--soft);font-weight:600;font-size:12px;color:var(--mute);position:sticky;top:0}
tbody tr,tr{transition:background .12s}tr:hover td{background:var(--soft)}
td input{width:100%;min-width:90px}td input.n{width:84px;min-width:0}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;color:#fff;white-space:nowrap}
.Not{background:#868e96}.Ongoing{background:#1c7ed6}.Completed{background:#2b9348}.Approaching{background:#e67700}
.Overdue,.Delayed,.Cancelled{background:#d62839}.Planned{background:#5c7cfa}.OnSchedule{background:#66a80f}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11px;color:var(--mute);margin:2px 4px 0 0}
.bar{background:var(--line);border-radius:5px;height:8px;min-width:90px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);transition:width .35s}
input[type=range]{padding:0;border:0;accent-color:var(--ok);width:110px;min-width:0;box-shadow:none}
.hd{cursor:ns-resize;display:inline-block;width:14px;height:14px;margin-left:3px;background:var(--tx);border-radius:3px;touch-action:none;vertical-align:middle}
tr.sel td{background:color-mix(in srgb,var(--warn) 30%,transparent)}.ph-RD{border-left:4px solid var(--rd)}.ph-RU{border-left:4px solid var(--ru)}
.dev{font-variant-numeric:tabular-nums}.pos{color:var(--bad)}.neg{color:var(--ru)}
.chartbox{position:relative}.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;display:none;pointer-events:none;background:var(--hd);color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;max-width:230px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px;align-items:center}
.legend label{cursor:pointer;display:flex;gap:5px;align-items:center}.legend i{display:inline-block;width:22px;border-top:3px solid;vertical-align:middle}
#ov{position:fixed;inset:0;background:rgba(5,8,12,.6);display:none;align-items:center;justify-content:center;z-index:30;padding:10px;backdrop-filter:blur(2px)}
#ov .m{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;max-width:540px;width:100%;max-height:92vh;overflow:auto;padding:18px}
#ov .m.wide{max-width:1020px}
.fr{display:grid;gap:4px;margin-bottom:9px}.fr label,.lb{font-size:12px;color:var(--mute)}.fr input,.fr select,.fr textarea{width:100%}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.err{background:var(--bad)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:5px}.bw{width:130px;font-size:12px}.bb{flex:1;background:var(--line);height:14px;border-radius:4px;overflow:hidden}.bb i{display:block;height:100%;background:linear-gradient(90deg,var(--rd),var(--ru));transition:width .5s}
.n-item{padding:9px 0;border-bottom:1px solid var(--line)}.n-item:last-child{border:0}.mute{color:var(--mute)}
.empty{padding:26px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:8px}
.pv{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;font-size:12px;margin-bottom:6px}.pv table{min-width:0}.pv td,.pv th{padding:3px 7px;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}.pv .hr td{background:color-mix(in srgb,var(--ru) 20%,transparent);font-weight:600}
.ib{background:transparent;border:1px solid var(--line);color:var(--tx);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:13px;padding:0;transition:all .12s}.ib:hover{border-color:var(--tx);background:var(--soft)}.ib.bad:hover{border-color:var(--bad);color:var(--bad)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.ck{width:30px;text-align:center}.ck input{width:auto;min-width:0;accent-color:var(--ru)}
.hgrid{display:flex;gap:2px;user-select:none;touch-action:none}.hb{display:block;width:20px;height:24px;border:1px solid var(--line);border-radius:3px;background:var(--soft);cursor:crosshair;transition:background .08s}.hb:hover{border-color:var(--ru)}.hb.on{background:var(--ru);border-color:var(--ru)}.hb.pre{background:color-mix(in srgb,var(--warn) 70%,transparent);border-color:var(--warn)}
.hlab{display:flex;gap:2px;font-size:10px;color:var(--mute);font-weight:400;margin-top:2px}.hlab span{width:20px;text-align:center}
tr.grp th{text-align:center;font-size:11px;letter-spacing:.6px;border-bottom:2px solid var(--line)}tr.grp th.gp{color:var(--rd);border-color:var(--rd)}tr.grp th.ga{color:var(--ru);border-color:var(--ru)}
.chartwrap{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}@media(min-width:1180px){.chartwrap{grid-template-columns:minmax(0,1fr) 310px}}
.opnote{border:2px solid var(--ok);border-radius:18px;padding:12px 15px;font-size:12.5px;line-height:1.55;max-height:440px;overflow:auto;background:color-mix(in srgb,var(--ok) 5%,var(--card))}.opnote h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.sel-bar{display:flex;gap:8px;align-items:center;margin:4px 0 8px;font-size:13px;color:var(--mute);min-height:28px}
.help{font-size:12.5px;color:var(--mute);margin-bottom:8px}.help summary{cursor:pointer;display:inline}
.fgrp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.fgrp label{font-size:12px;color:var(--mute)}
</style></head><body>
<div id="ld"></div>
<div id="top"><header><h1>Furnace Shutdown Management<small>Maintenance · Power Ramp Down / Ramp Up</small></h1>
<select id="proj"></select><select id="tz" title="Zona waktu"><option value="WIB">WIB (UTC+7)</option><option value="WITA">WITA (UTC+8)</option><option value="WIT">WIT (UTC+9)</option></select><button id="bell" title="Notifikasi">🔔 <span id="bc">0</span></button>
<button id="xl">⬇ Export Excel</button><button id="th" title="Ganti tema"></button><button id="who" title="Ganti nama"></button></header>
<nav id="nav"></nav></div>
<main><section id="s-ov"></section><section id="s-mt"></section><section id="s-pw"></section><section id="s-tl"></section><section id="s-an"></section><section id="s-nt"></section><section id="s-ad"></section></main>
<div id="ov"><div class="m" id="mb"></div></div><div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const pn=n=>{n=String(n==null?'':n);const m=n.match(/^[A-Z][a-z]{2} ([A-Z][a-z]{2}) (\d{1,2}) (\d{4}) \d\d:\d\d:\d\d GMT/);return m?m[2]+' '+m[1]+' '+m[3]:n;}; // nama project yang terlanjur jadi teks tanggal panjang
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toI=s=>s?String(s).replace(' ','T').slice(0,16):'', toS=v=>v?String(v).replace('T',' '):'';
const D=s=>s?new Date(toI(s)):null, N=v=>(v===''||v==null)?NaN:Number(v);
const f2=v=>isNaN(v)?'-':(Math.round(v*100)/100).toString(), z=n=>String(n).padStart(2,'0');
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}},lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
const fmtD=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const hr0=()=>{const d=new Date();return fmtD(d)+'T'+z(d.getHours())+':00';}; // default menit = 00
const TABS=[['ov','Overview'],['mt','Maintenance'],['pw','Power'],['tl','Timeline'],['an','Analytics'],['nt','Notifikasi'],['ad','Admin']];
const ACTS=['Open Skimming','Close Skimming','Open Tapping','Close Tapping','Kiln Start Feeding','Kiln Stop Feeding','Other'];
const PHASES=['Ramp Down','Ramp Up'],PHASES2=[['Ramp Down','ph-RD'],['Ramp Up','ph-RU']];
let S={g:{day:'',from:8,to:16},sel:new Set(),by:'',pw:'',perms:{},cfg:{},projects:[],templates:[],localFields:[],people:[],sid:'',tab:'ov',tasks:[],power:{schedule:[],intervals:[],activities:[]},notifs:[],seen:{},dirty:{},cv:{p:1,a:1,k:1,n:1},pts:[],showArch:false};
let MF={q:'',st:'',dl:'',ff:{}};

/* ---- tema terang / gelap ---- */
function applyTheme(t){document.documentElement.dataset.theme=t;$('th').textContent=t==='dark'?'☀ Terang':'🌙 Gelap';lsSet('fsm_theme',t);}
$('th').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
applyTheme(lsGet('fsm_theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));

/* ---- komunikasi ke Code.gs (web app Apps Script, via fetch) ---- */
const API_URL='https://script.google.com/macros/s/AKfycbyV8SpG9Yhfldcdo942mivIvSWzAQBEbdoKF4V5zt8XPZQlDdRY4Trk9WwKEToldSHy/exec';
const AF={deleteTasks:'task_delete',deletePowers:'power_plan',deleteActivities:'power_plan',deleteProjects:'project_delete',setProjectStatus:'project_edit',saveOpNote:'power_edit',updateProgress:'task_progress',deleteTask:'task_delete',pasteCells:'power_edit',saveCalcine:'power_edit',saveTz:'tz_edit',saveTask:'task_edit',archiveTask:'task_edit',importTasks:'task_edit',savePower:'power_edit',fillGhe:'power_edit',saveActivity:'power_edit',importPower:'power_edit',generateSchedule:'power_plan',deletePower:'power_plan',saveProject:'project_edit',saveTemplate:'template_edit',updateTemplate:'template_edit',saveSettings:'settings_edit',savePerms:'matrix_edit'};
const locked=f=>f==='matrix_edit'||(S.perms[f]&&S.perms[f].mode==='PASSWORD');
async function ensurePw(f){if(locked(f)&&!S.pw&&!(await askPw()))throw new Error('Dibatalkan');}
let busy=0;
let SEQ=0;
function absorb(r,latest){if(!r||typeof r!=='object')return; // hasil server langsung dipakai, tanpa fetch ulang
 if(r.task){const i=S.tasks.findIndex(x=>x.task_id===r.task.task_id);if(i>=0)S.tasks[i]=r.task;else S.tasks.push(r.task);}
 if(latest&&r.schedule&&r.intervals&&r.activities)S.power=r;}
async function call(a,p){
 if(AF[a])await ensurePw(AF[a]);
 busy++;$('ld').className='on';const my=++SEQ;
 try{const body=JSON.stringify(Object.assign({action:a,by:S.by,pw:S.pw,reqId:Math.random().toString(36).slice(2)+Date.now()},p||{}));
  const r=await fetch(API_URL,{method:'POST',body}); // tanpa header khusus agar tidak kena preflight CORS
  const j=await r.json();if(!j.ok)throw new Error(j.error);absorb(j.data,my===SEQ);return j.data;}
 finally{if(!--busy){$('ld').style.width='100%';setTimeout(()=>{$('ld').className='';$('ld').style.width='';},250);}}}
function askPw(){return new Promise(res=>{modal('Password diperlukan',inp('pw_i','Password (sheet PASWORD sel A1)','','password'),async()=>{
  const v=gv('pw_i'),r=await call('checkPassword',{pw:v});if(!r.valid)throw new Error('Password salah.');S.pw=v;setTimeout(()=>res(true),80);},'Buka');
  $('mx').onclick=()=>{closeM();res(false);};});}
function askName(){return new Promise(res=>{modal('Siapa Anda?','<div class="mute" style="margin-bottom:8px">Nama dicatat di riwayat perubahan sebagai "Updated By".</div>'+inp('nm_i','Nama',S.by||''),async()=>{
  const v=gv('nm_i').trim();if(!v)throw new Error('Isi nama dulu.');S.by=v;lsSet('fsm_by',v);setTimeout(res,80);},'Simpan');
  $('mx').onclick=()=>{closeM();if(!S.by)S.by='Anonim';res();};});}
function toast(m,err){const t=$('toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',err?5000:2200);}
async function run(fn,btn){if(btn)btn.disabled=true;try{return await fn();}catch(e){let m=e.message||String(e);
 if(/^PASSWORD_(WRONG|REQUIRED)/.test(m))S.pw='';
 if(m==='Failed to fetch')m='Tidak bisa terhubung ke server. Pastikan web app di-deploy dengan akses "Anyone" (versi terbaru) dan URL benar.';
 toast(m.replace(/^PASSWORD_[A-Z]+: /,''),1);}finally{if(btn)btn.disabled=false;}}
function modal(title,html,onSave,label,wide){
 $('mb').className='m'+(wide?' wide':'');
 $('mb').innerHTML='<h2>'+esc(title)+'</h2>'+html+'<div class="tb" style="margin-top:10px;justify-content:flex-end"><button class="b alt" id="mx">Tutup</button>'+(onSave?'<button class="b" id="ms">'+(label||'Simpan')+'</button>':'')+'</div>';
 $('ov').style.display='flex';$('mx').onclick=closeM;
 if(onSave)$('ms').onclick=()=>run(async()=>{await onSave();closeM();},$('ms'));}
const closeM=()=>$('ov').style.display='none';
const fld=(id,l,inner)=>'<div class="fr"><label>'+l+'</label>'+inner+'</div>';
const inp=(id,l,v,t)=>fld(id,l,'<input id="'+id+'" type="'+(t||'text')+'" value="'+esc(v)+'">');
const sel=(id,l,opts,v)=>fld(id,l,'<select id="'+id+'">'+opts.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>');
const gv=id=>$(id).value;
const bdg=s=>'<span class="badge '+(s==='Not Started'?'Not':s==='On Schedule'?'OnSchedule':s)+'">'+esc(s)+'</span>';
const empty=m=>'<div class="empty">'+m+'</div>';

/* ---- boot & state ---- */
async function boot(){
 S.by=lsGet('fsm_by');if(!S.by)await askName();
 const d=await call('bootstrap');Object.assign(S,d);
 const who=()=>$('who').textContent='👤 '+S.by;who();$('who').onclick=async()=>{await askName();who();};$('xl').onclick=exportXlsx;
 $('nav').innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('');
 $('nav').onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t);};
 $('bell').onclick=()=>{show('nt');if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();};
 $('proj').onchange=()=>{S.sid=gv('proj');refresh();};
 $('tz').value=S.cfg.TZ||'WITA';$('tz').onchange=()=>run(async()=>{const v=gv('tz');try{await call('saveTz',{tz:v});S.cfg.TZ=v;toast('Zona waktu: '+v);await refresh();}catch(e){$('tz').value=S.cfg.TZ||'WITA';throw e;}});
 fillProj();show('ov');
 initPw();setInterval(()=>S.sid&&!busy&&!document.hidden&&pollNotifs(),180000);
}
function fillProj(){const sel=$('proj');sel.innerHTML=S.projects.map(p=>'<option value="'+p.shutdown_id+'">'+esc(pn(p.name))+(p.status!=='Active'?' ('+p.status+')':'')+'</option>').join('')||'<option value="">(belum ada project)</option>';
 if(!S.sid||!S.projects.find(p=>p.shutdown_id===S.sid))S.sid=S.projects.length?S.projects[0].shutdown_id:'';sel.value=S.sid;refresh();}
const R={ov:()=>renderOv(),mt:()=>renderMt(),pw:()=>renderPw(),an:()=>renderAn(),nt:()=>renderNt(),ad:()=>renderAd()};
function show(t){S.tab=t;document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='tl')loadTl();else paint(t);}
function paint(t){if(S.dirty[t]&&R[t]){S.dirty[t]=0;R[t]();redrawCharts();}}
function rerender(){Object.keys(R).forEach(k=>S.dirty[k]=1);paint(S.tab);$('bc').textContent=S.notifs.length;}
async function refresh(){

 try{await ensurePw('task_edit');}catch(e){drawMt();return;}

function recalcLocal(){ // cermin recalc_ di server agar angka calcine & delta langsung berubah di layar
 const avg=S.cfg.CALCINE_METHOD==='AVERAGE',old={},out=[];S.power.intervals.forEach(i=>old[i.interval_id]=i);
 const rate=(p,g)=>(N(p)>0&&N(g)>0)?N(p)*1000/N(g):null; // t/h = MW x 1000 / (kWh/t)
 PHASES.forEach(ph=>{const r=S.power.schedule.filter(x=>x.phase===ph&&isFinite(+D(x.schedule_datetime))).sort((a,b)=>a.schedule_datetime<b.schedule_datetime?-1:1);
  for(let i=0;i<r.length-1;i++){const a=r[i],b=r[i+1],h=(D(b.schedule_datetime)-D(a.schedule_datetime))/36e5,ah=(a.actual_datetime&&b.actual_datetime)?(D(b.actual_datetime)-D(a.actual_datetime))/36e5:h;

const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,aug:8,ags:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
function mk(y,mo,d,h,mi){y=+y;if(y<100)y+=2000;if(mo>12&&d<=12){const x=mo;mo=d;d=x;}if(mo<1||mo>12||d<1||d>31)return '';return y+'-'+z(mo)+'-'+z(d)+' '+z(h||0)+':'+z(mi||0);}
function pDT(v){v=String(v==null?'':v).trim();if(!v)return '';let m;
 if(m=v.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))return mk(m[1],+m[2],+m[3],+m[4],+m[5]);
 if(m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T,]+(\d{1,2})[:.](\d{2}))?/))return mk(m[3],+m[2],+m[1],+m[4],+m[5]);

 const t=new Date(v);return isNaN(t)?'':mk(t.getFullYear(),t.getMonth()+1,t.getDate(),t.getHours(),t.getMinutes());}
const pT=v=>{const m=String(v||'').match(/(\d{1,2})[:.](\d{2})/);return m?z(m[1])+':'+m[2]:'';};
const pNum=v=>{const n=Number(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?'':n;};
const pPct=v=>{const n=Number(String(v).replace('%','').replace(',','.'));return isNaN(n)?0:Math.min(100,Math.max(0,n));};
const colL=i=>{let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26);}return s;};
const clean=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
const IMP={
 task:{title:'Import Maintenance dari Excel',roles:[['description','Work Description *'],['planned_start','Planned Start'],['planned_finish','Planned Finish'],['pic','PIC'],['progress','Progress (%)'],['remark','Remark'],['custom','Kolom tambahan (field)'],['ignore','Abaikan']]},
 power:{title:'Import Power Ramp Down / Ramp Up dari Excel',roles:[['phase','Phase'],['schedule_datetime','Schedule DateTime'],['date','Tanggal (kolom terpisah)'],['time','Jam (kolom terpisah)'],['planned_power','Planned Power (MW)'],['planned_ghe','Planned GHE (kWh/t)'],['actual_datetime','Actual DateTime'],['actual_power','Actual Power (MW)'],['actual_ghe','Actual GHE (kWh/t)'],['remark','Remark'],['ignore','Abaikan']]}};
function guess(kind,n,filled,samples){const s=n.toLowerCase();if(!filled)return 'ignore';
 if(kind==='task'){
  if(s==='works'||s==='work'||/pekerjaan|uraian|kegiatan|description|activity/.test(s))return 'description';
  if(/\bpic\b|penanggung/.test(s))return 'pic';if(/progress|persen|%/.test(s)||(samples.length&&samples.every(x=>/^\d+([.,]\d+)?\s*%$/.test(x))))return 'progress';
  if(/remark|keterangan|catatan/.test(s))return 'remark';if(/start|mulai/.test(s))return 'planned_start';if(/finish|selesai|\bend\b/.test(s))return 'planned_finish';return 'custom';}
 const act=/act|aktual|real/.test(s);
 if(/phase|fase|ramp/.test(s)&&!/power|ghe/.test(s))return 'phase';if(/ghe/.test(s))return act?'actual_ghe':'planned_ghe';if(/power|mw|daya/.test(s))return act?'actual_power':'planned_power';
 if(/date.?time|tanggal.*jam/.test(s))return act?'actual_datetime':'schedule_datetime';if(/tanggal|date|tgl/.test(s))return 'date';if(/jam|time|waktu/.test(s))return 'time';if(/remark|ket|catatan/.test(s))return 'remark';return 'ignore';}
let W=null;
async function openImport(kind){
 try{await ensurePw(kind==='task'?'task_edit':'power_edit');}catch(e){return;}
 if(!window.XLSX)return toast('Library Excel belum termuat (cek koneksi internet).',1);
 if(!S.sid)return toast('Pilih / buat shutdown project dulu.',1);
 W={kind,wb:null,aoa:[],off:{r:0,c:0},hs:0,hr:1,ds:1,cols:[],sheet:''};
 modal(IMP[kind].title,'<div class="fr"><label>File Excel / CSV</label><input type="file" id="iw_f" accept=".xlsx,.xlsm,.xls,.csv"></div><details style="margin-bottom:8px"><summary>atau tempel dari Excel</summary><textarea id="iw_t" rows="4" style="width:100%" placeholder="Salin sel dari Excel (termasuk baris header) lalu tempel di sini"></textarea><button class="b alt sm" id="iw_tb">Baca tempelan</button></details><div id="iw"></div>',doImport,'Impor',true);
 $('iw_f').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>run(async()=>loadWb(XLSX.read(rd.result,{type:'array'})));rd.readAsArrayBuffer(f);};
 $('iw_tb').onclick=()=>run(async()=>{if(!gv('iw_t').trim())throw new Error('Tempel data dulu.');loadWb(XLSX.read(gv('iw_t'),{type:'string'}));});}
function loadWb(wb){W.wb=wb;W.sheet=wb.SheetNames[0];useSheet();renderIw();}
function useSheet(){ // baca sheet -> matriks; sel merge diisi nilai induknya (header bertingkat & kolom scope yang di-merge)
 const ws=W.wb.Sheets[W.sheet];if(!ws||!ws['!ref'])throw new Error('Sheet kosong.');
 const rg=XLSX.utils.decode_range(ws['!ref']);W.off={r:rg.s.r,c:rg.s.c};const nc=rg.e.c-rg.s.c+1;
 const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>{r=r.slice(0,nc);while(r.length<nc)r.push('');return r;});
 const ne=r=>r.filter(x=>clean(x)!=='').length;let hs=aoa.findIndex(r=>ne(r)>=3);if(hs<0)hs=0;
 const mg=ws['!merges']||[];W.hr=mg.some(m=>m.s.r-W.off.r===hs&&m.e.c>m.s.c)?2:1; // ada merge horizontal di baris header -> 2 baris header
 mg.forEach(m=>{const v=(aoa[m.s.r-W.off.r]||[])[m.s.c-W.off.c];if(v===''||v==null)return;
  for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++){const row=aoa[r-W.off.r];if(row&&c-W.off.c<nc&&clean(row[c-W.off.c])==='')row[c-W.off.c]=v;}});
 W.aoa=aoa;W.hs=hs;W.ds=hs+W.hr;}
function buildCols(){
 const A=W.aoa,nc=A[0]?A[0].length:0;W.cols=[];
 for(let c=0;c<nc;c++){const parts=[];for(let r=W.hs;r<W.hs+W.hr&&r<A.length;r++){const v=clean(A[r][c]);if(v&&!parts.includes(v))parts.push(v);}
  const name=parts.join(' › ')||'Kolom '+colL(c),vals=[];for(let r=W.ds;r<A.length;r++){const v=clean(A[r][c]);if(v)vals.push(v);}
  W.cols.push({i:c,name,fname:name,n:vals.length,samples:vals.slice(0,3),role:guess(W.kind,name,vals.length,vals.slice(0,40))});}
 let seen=false;W.cols.forEach(c=>{if(c.role==='description'){if(seen)c.role='custom';seen=true;}});}
function renderIw(){
 $('iw').innerHTML='<div class="tb"><label class="lb">Sheet <select id="iw_s">'+W.wb.SheetNames.map(s=>'<option'+(s===W.sheet?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></label><label class="lb">Baris header pertama <input id="iw_hs" type="number" min="1" style="width:70px"></label><label class="lb">Jumlah baris header <select id="iw_hr"><option>1</option><option>2</option><option>3</option></select></label><label class="lb">Baris data pertama <input id="iw_dr" type="number" min="1" style="width:70px"></label></div>'+
 '<div class="mute" style="margin-bottom:6px">Header 2 baris (induk + sub header) digabung otomatis, contoh: <i>Duration (H) › 8:00</i>. Sesuaikan angka di atas bila deteksi kurang tepat.</div><div class="pv" id="iw_pv"></div><h3>Pemetaan kolom</h3><div class="tw" style="max-height:300px;overflow:auto" id="iw_map"></div><div id="iw_opt"></div>';
 const sync=()=>{$('iw_hs').value=W.hs+W.off.r+1;$('iw_hr').value=W.hr;$('iw_dr').value=W.ds+W.off.r+1;};sync();
 $('iw_s').onchange=()=>run(async()=>{W.sheet=gv('iw_s');useSheet();sync();rebuild();});
 const hdr=()=>{W.hs=Math.max(0,+gv('iw_hs')-1-W.off.r);W.hr=+gv('iw_hr');W.ds=W.hs+W.hr;sync();rebuild();};
 $('iw_hs').onchange=hdr;$('iw_hr').onchange=hdr;$('iw_dr').onchange=()=>{W.ds=Math.max(W.hs+1,+gv('iw_dr')-1-W.off.r);sync();rebuild();};
 const o=W.kind==='task'?
 '<h3>Tujuan impor</h3><div class="fr"><label><input type="radio" name="iw_tp" value="cur" checked> Project saat ini: <b>'+esc(pn(proj().name)||'')+'</b></label><label><input type="radio" name="iw_tp" value="new"> Project baru: <input id="iw_pn" placeholder="Nama project baru" style="width:60%"></label></div>'+
 '<div class="fr"><label>Kolom tambahan (non-standar) disimpan sebagai:</label><label><input type="radio" name="iw_fm" value="local" checked> Field khusus project ini saja (tidak disimpan sebagai template)</label><label><input type="radio" name="iw_fm" value="tpl"> Template baru: <input id="iw_tn" placeholder="Nama template baru" style="width:50%"></label></div>'+
 '<div class="tb"><label class="lb">Planned Start default <input type="datetime-local" id="iw_d1"></label><label class="lb">Planned Finish default <input type="datetime-local" id="iw_d2"></label></div><div class="mute">Default dipakai bila kolom tanggal tidak dipetakan atau selnya kosong.</div>'+
 '<label style="display:block;margin-top:6px"><input type="checkbox" id="iw_arch"> Arsipkan task lama di project tujuan lebih dulu</label>':
 '<h3>Opsi</h3><div class="fr"><label>Phase</label><select id="iw_ph"><option value="col">Ambil dari kolom (dipetakan sebagai "Phase")</option><option>Ramp Down</option><option>Ramp Up</option></select></div><label><input type="checkbox" id="iw_rep"> Ganti jadwal yang sudah ada pada phase yang diimpor (kalau tidak, titik dengan waktu sama akan diperbarui)</label>';
 $('iw_opt').innerHTML=o;rebuild();}
function rebuild(){
 buildCols();const A=W.aoa,from=Math.max(0,W.hs-1),to=Math.min(A.length,W.ds+4),nc=Math.min(A[0]?A[0].length:0,60);
 let h='<table><tr><th>#</th>'+Array.from({length:nc},(_,c)=>'<th>'+colL(c)+'</th>').join('')+'</tr>';
 for(let r=from;r<to;r++)h+='<tr'+(r>=W.hs&&r<W.hs+W.hr?' class="hr"':'')+'><td>'+(r+W.off.r+1)+'</td>'+A[r].slice(0,nc).map(v=>'<td title="'+esc(v)+'">'+esc(clean(v).slice(0,40))+'</td>').join('')+'</tr>';
 $('iw_pv').innerHTML=h+'</table>';
 const roles=IMP[W.kind].roles;
 $('iw_map').innerHTML='<table><tr><th>Kolom</th><th>Nama dari header</th><th>Contoh isi</th><th>Terisi</th><th>Jadikan</th><th>Nama field (kolom tambahan)</th></tr>'+W.cols.map(c=>'<tr><td>'+colL(c.i)+'</td><td>'+esc(c.name)+'</td><td class="mute">'+esc(c.samples.join(' | ').slice(0,60))+'</td><td>'+c.n+'</td><td><select data-ci="'+c.i+'">'+roles.map(r=>'<option value="'+r[0]+'"'+(r[0]===c.role?' selected':'')+'>'+r[1]+'</option>').join('')+'</select></td><td><input data-fn="'+c.i+'" value="'+esc(c.fname)+'"'+(c.role==='custom'?'':' disabled')+'></td></tr>').join('')+'</table>';
 $('iw_map').querySelectorAll('select').forEach(s=>s.onchange=()=>{const c=W.cols[+s.dataset.ci];c.role=s.value;$('iw_map').querySelector('[data-fn="'+c.i+'"]').disabled=c.role!=='custom';});
 $('iw_map').querySelectorAll('[data-fn]').forEach(i=>i.oninput=()=>W.cols[+i.dataset.fn].fname=i.value.trim());}
function mapRows(){const A=W.aoa,rows=[];let badDate=0;
 const by=r=>W.cols.filter(c=>c.role===r);
 for(let r=W.ds;r<A.length;r++){const row=A[r],g=c=>clean(row[c.i]);
  if(W.kind==='task'){const o={custom:{}};
   W.cols.forEach(c=>{const v=W.cols[c.i].role==='description'?String(row[c.i]==null?'':row[c.i]).trim():g(c);if(!v)return;
    if(c.role==='description')o.description=v;else if(c.role==='planned_start'||c.role==='planned_finish'){const d=pDT(v);if(d)o[c.role]=d;else badDate++;}
    else if(c.role==='progress')o.progress=pPct(v);else if(c.role==='custom'){if(c.fname)o.custom[c.fname]=v;}else if(c.role!=='ignore')o[c.role]=v;});
   if(!o.description)continue;rows.push(o);}
  else{const o={},first=c=>{const x=by(c)[0];return x?g(x):'';};
   const ph=gv('iw_ph');let phase=ph;if(ph==='col'){const t=first('phase').toLowerCase();phase=/down|turun|\brd\b/.test(t)?'Ramp Down':/up|naik|\bru\b/.test(t)?'Ramp Up':'';}
   let dt=pDT(first('schedule_datetime'));if(!dt){const d=pDT(first('date')),t=pT(first('time'));if(d)dt=d.slice(0,10)+' '+(t||d.slice(11));}
   if(!phase||!dt){if(W.cols.some(c=>g(c)))badDate++;continue;}
   o.phase=phase;o.schedule_datetime=dt;['planned_power','planned_ghe','actual_power','actual_ghe'].forEach(k=>o[k]=pNum(first(k)));
   o.actual_datetime=pDT(first('actual_datetime'));o.remark=first('remark');rows.push(o);}}
 return {rows,badDate};}
async function doImport(){
 if(!W||!W.wb)throw new Error('Pilih file Excel dulu atau tempel datanya.');
 const {rows,badDate}=mapRows();
 if(W.kind==='task'){
  if(!W.cols.some(c=>c.role==='description'))throw new Error('Petakan satu kolom sebagai "Work Description".');
  if(!rows.length)throw new Error('Tidak ada baris dengan Work Description.');
  const d1=toS(gv('iw_d1')),d2=toS(gv('iw_d2'));rows.forEach(o=>{o.planned_start=o.planned_start||d1;o.planned_finish=o.planned_finish||d2;});
  const names=[...new Set(W.cols.filter(c=>c.role==='custom'&&c.fname).map(c=>c.fname))],newP=document.querySelector('input[name=iw_tp]:checked').value==='new',tplMode=document.querySelector('input[name=iw_fm]:checked').value==='tpl';
  if(newP&&!gv('iw_pn').trim())throw new Error('Isi nama project baru.');if(tplMode&&!gv('iw_tn').trim())throw new Error('Isi nama template baru.');
  let sid=S.sid,tid=proj().template_id||(S.templates[0]||{}).template_id;
  if(tplMode){const r=await call('saveTemplate',{name:gv('iw_tn').trim(),fields:names.map(n=>({name:n,type:'text',options:''}))});tid=r.template_id;}
  if(newP){const r=await call('saveProject',{project:{name:gv('iw_pn').trim(),template_id:tid,status:'Active'}});sid=r.shutdown_id;}
  else if(tplMode)await call('saveProject',{project:{shutdown_id:sid,name:pn(proj().name),template_id:tid,start_date:proj().start_date,end_date:proj().end_date,status:proj().status}});
  const res=await call('importTasks',{shutdown_id:sid,rows,fields:names,archive_old:document.getElementById('iw_arch').checked});
  S.sid=sid;const d=await call('bootstrap');Object.assign(S,d);fillProj();toast(res.count+' task diimpor'+(badDate?' · '+badDate+' tanggal tidak terbaca (diganti default)':''));
 }else{
  if(!rows.length)throw new Error('Tidak ada baris valid. Petakan Phase dan Schedule DateTime (atau Tanggal + Jam).');
  const res=await call('importPower',{shutdown_id:S.sid,rows,replace:document.getElementById('iw_rep').checked});rerender();
  toast(res.imported.added+' titik ditambah, '+res.imported.updated+' diperbarui'+(badDate?' · '+badDate+' baris dilewati (phase/waktu tidak terbaca)':''));}}

/* ---- Export Excel (semua data project aktif) ---- */
async function exportXlsx(){await run(async()=>{
 if(!S.sid)throw new Error('Pilih shutdown project dulu.');if(!window.XLSX)throw new Error('Library Excel belum termuat (cek koneksi internet).');
 const d=await call('exportData',{shutdown_id:S.sid}),fs=pfields(),nm=v=>v===''||v==null||isNaN(Number(v))?(v||''):Number(v);
 const wb=XLSX.utils.book_new(),add=(n,r)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r.length?r:[{'(kosong)':''}]),n);
 add('Maintenance',d.tasks.map(t=>{const o={'Task ID':t.task_id,'Work Description':t.description,'PIC':t.pic,'Planned Start':t.planned_start,'Planned Finish':t.planned_finish,'Duration (h)':nm(t.planned_duration_h),'Actual Start':t.actual_start,'Actual Finish':t.actual_finish,'Progress (%)':nm(t.progress),'Status':t.status,'Deadline':t.deadline,'Remark':t.remark,'Last Updated':t.last_updated,'Updated By':t.updated_by,'Archived':t.archived==='Y'?'Ya':''};fs.forEach(f=>o[f.field_name]=t.custom[f.field_id]||'');return o;}));
 add('Maintenance Log',d.log.map(l=>({'Task ID':l.task_id,'Updated By':l.updated_by,'Timestamp':l.timestamp,'Field':l.field_name,'Old':l.old_value,'New':l.new_value,'Remark':l.remark})));
 add('Power Schedule',d.schedule.map(r=>({'Phase':r.phase,'Plan DateTime':r.schedule_datetime,'Plan Power (MW)':nm(r.planned_power),'Plan GHE (kWh/t)':nm(r.planned_ghe),'Actual DateTime':r.actual_datetime,'Actual Power (MW)':nm(r.actual_power),'Actual GHE (kWh/t)':nm(r.actual_ghe),'Delta Power':(r.actual_power===''||r.planned_power==='')?'':Number(r.actual_power)-Number(r.planned_power),'Delta GHE':(r.actual_ghe===''||r.planned_ghe==='')?'':Number(r.actual_ghe)-Number(r.planned_ghe),'Remark':r.remark,'Updated By':r.updated_by,'Updated At':r.updated_at})));
 add('Calcine Interval',d.intervals.map(i=>({'Phase':i.phase,'Start':i.start_datetime,'End':i.end_datetime,'Duration (h)':nm(i.duration_h),'Planned Calcine (t/h)':nm(i.planned_calcine),'Actual Calcine (t/h)':nm(i.actual_calcine),'Planned Calcine (ton)':i.planned_calcine===''?'':Number(i.planned_calcine)*Number(i.duration_h),'Actual Calcine (ton)':i.actual_calcine===''?'':Number(i.actual_calcine)*Number(i.duration_h),'Status':i.calc_status,'Formula':i.formula_version,'Planned mode':i.planned_calcine_mode||'Auto','Actual mode':i.actual_calcine_mode||'Auto'})));
 add('Operational Activities',d.activities.map(a=>({'Phase':a.phase,'Activity':a.activity_name,'Planned':a.planned_datetime,'Planned End':a.planned_end,'Actual':a.actual_datetime,'Actual End':a.actual_end,'Status':a.status_eff,'Remark':a.remark,'Updated By':a.updated_by,'Updated At':a.updated_at})));
 add('Power Log',d.powerlog.map(l=>({'Ref ID':l.schedule_id,'Updated By':l.updated_by,'Timestamp':l.timestamp,'Field':l.field_name,'Old':l.old_value,'New':l.new_value})));
 XLSX.writeFile(wb,'Shutdown_'+(pn(proj().name)||'project').replace(/[^\w-]+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx');toast('File Excel diunduh');});}

run(boot);
